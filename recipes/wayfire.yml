# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Wayfire next to GNOME, with wf-shell, wcm and wayfire-plugins-extra. GNOME stays the default session. Two GDM entries,
# "Wayfire (OpenGL)" and "Wayfire (Vulkan)", differ only in WLR_RENDERER, to compare the two wlroots renderers.
# The stack is built from upstream main by the wayfire-stack workflow (files/src/wayfire); the commits it holds are
# in /usr/share/wayfire/stack-commits. The PAM service "frost" is for the lock screen of the own shell Frost.
modules:
  - type: files
    files:
      - source: wayfire
        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # The libraries the stack links, as resolved with ldd in a plain Fedora 45. Bazzite already has
        # wireplumber-libs (terra-wireplumber-libs); the ldd check below covers swaps like that.
        - alsa-lib
        - atkmm
        - cairomm1.16
        - glibmm2.4
        - glibmm2.68
        - gtk4-layer-shell
        - gtkmm3.0
        - gtkmm4.0
        - libdbusmenu
        - libepoxy
        - libevdev
        - libsigc++20
        - libsigc++30
        - pulseaudio-libs-glib2
        - wlroots
        - yyjson
        - xdg-desktop-portal-wlr  # screen sharing; wayfire-portals.conf prefers it
        - mate-polkit             # Wayfire has no polkit agent of its own

  - type: copy
    from: ghcr.io/hadiskeini/wayfire-stack:current
    src: /out/
    dest: /

  - type: script
    snippets:
      - mv /etc/pam.d/wf-locker /usr/lib/pam.d/wf-locker
      - rm /usr/share/wayland-sessions/wayfire.desktop
      - "! find /usr/bin/wayfire /usr/bin/wf-* /usr/bin/wcm /usr/lib64/wayfire -type f -exec ldd {} + 2>/dev/null | grep 'not found'"
