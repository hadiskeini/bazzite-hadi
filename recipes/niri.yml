# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# niri next to GNOME, for the own shell Frost; in both images. GDM entry "niri"; GNOME stays the default session.
# Frost itself is not in the image while it changes daily: ~/home installs it (portable/frost) and starts it with
# niri. The image gives what needs root: the PAM service of Frost's lock screen and the polkit agent.
modules:
  - type: files
    files:
      - source: niri
        destination: /

  # Without weak dependencies: they are alacritty, fuzzel, waybar, swaylock and gnome-keyring, and a second
  # keyring would take the secret service from oo7.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - niri
        - xwayland-satellite      # X11 apps (Steam's UI); niri starts it on demand
        - mate-polkit

  # niri from its main branch: the COPR builds each commit. Fedora's release has the higher version number, so an
  # install alone keeps it; the swap from the COPR gives the git build, with its dependencies from Fedora.
  # The image fingerprints (.github/fingerprint) include the COPR version, so a new commit starts a build.
  - type: dnf
    repos:
      copr:
        - yalter/niri-git
      cleanup: true
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:yalter:niri-git
        packages:
          - niri

  - type: systemd
    user:
      enabled:
        - holdsuper-niri.service
        - polkit-mate-niri.service
