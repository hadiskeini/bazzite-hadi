# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# niri next to GNOME, with Dux Shell (formerly DankMaterialShell); in both images.
# niri-git: daily builds of niri's main branch by its author. Dux Shell keeps its old package name, dms.
# The COPRs are on only for this module; every image build takes their newest packages.
modules:
  - type: dnf
    repos:
      copr:
        - yalter/niri-git
        - avengemedia/dms
        - avengemedia/danklinux   # quickshell for Dux Shell
      cleanup: true
    install:
      packages:
        - niri
        - xwayland-satellite      # X11 apps under niri
        - fuzzel                  # app launcher on Super+D
        - dms

  # Fedora's release niri (26.04) has the higher version number. A swap from the COPR alone gives the git build;
  # an install from it alone finds none of niri's dependencies, which come from Fedora.
  - type: dnf
    repos:
      copr:
        - yalter/niri-git
      cleanup: true
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:yalter:niri-git
        packages:
          - niri

  # Dux Shell starts with niri only, not with GNOME (its own unit is WantedBy graphical-session.target).
  # oo7-daemon: the secret service that takes the login password from pam_oo7 (within 120 s of login). GNOME's
  # session starts it. In niri, D-Bus started gnome-keyring instead: a locked, separate keyring, and Brave made a new
  # cookie key there and dropped every cookie. So niri starts oo7 too, and D-Bus activation goes only to oo7.
  - type: script
    snippets:
      - mkdir -p /usr/lib/systemd/user/niri.service.wants
      - ln -s ../dms.service /usr/lib/systemd/user/niri.service.wants/dms.service
      - |
        if [ -f /usr/lib/systemd/user/oo7-daemon.service ]; then
          ln -s ../oo7-daemon.service /usr/lib/systemd/user/niri.service.wants/oo7-daemon.service
          printf '%s\n' '[D-BUS Service]' 'Name=org.freedesktop.secrets' 'Exec=/bin/false' 'SystemdService=oo7-daemon.service' > /usr/share/dbus-1/services/org.freedesktop.secrets.service
        fi
