# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# niri next to GNOME, with Dux Shell (formerly DankMaterialShell); in both images.
# niri, Dux Shell and Quickshell are all git builds of their main branches. Dux Shell keeps its old package name, dms.
# The COPRs are on only for this module; every image build takes their newest packages.
modules:
  - type: dnf
    repos:
      copr:
        - yalter/niri-git
        - duxlabs/dms-git
        - duxlabs/dux-repo        # quickshell-git for Dux Shell
      cleanup: true
    install:
      packages:
        - niri
        - xwayland-satellite      # X11 apps under niri
        - fuzzel                  # app launcher on Super+D
        - dms
        - quickshell-git          # dms accepts the release quickshell too; without this line dnf can pick it
        # Picks the terminal from ~/.config/xdg-terminals.list (Ghostty) for GLib, GNOME and Dux Shell; without it
        # GLib falls back to Ptyxis.
        - xdg-terminal-exec
        - qt6-qtimageformats      # WebP and more for Dux Shell (Qt): the wallpaper is a .webp
        - dux-calendar            # events in the bar's clock popup; signs in to Google itself
        - dux-files
        - khal                    # Dux Shell's fallback calendar backend

  # Fedora's release niri (26.04) has the higher version number. A swap from the COPR alone gives the git build;
  # an install from it alone finds none of niri's dependencies, which come from Fedora.
  - type: dnf
    repos:
      copr:
        - yalter/niri-git
      cleanup: true
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:yalter:niri-git
        packages:
          - niri

  # Fedora has xwayland-satellite 0.8.2: it focuses override-redirect popups, so every Steam menu closes at once.
  # 0.8.3 has the fix (upstream add2795). Remove this module when Fedora ships 0.8.3 or later.
  - type: dnf
    repos:
      copr:
        - ulysg/xwayland-satellite
      cleanup: true
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:ulysg:xwayland-satellite
        packages:
          - xwayland-satellite

  # Dux Shell and Dux Calendar start with niri only, not with GNOME (their own units are WantedBy
  # graphical-session.target).
  # oo7-daemon: the secret service that takes the login password from pam_oo7 (within 120 s of login). GNOME's
  # session starts it. In niri, D-Bus started gnome-keyring instead: a locked, separate keyring, and Brave made a new
  # cookie key there and dropped every cookie. So niri starts oo7 too, and D-Bus activation goes only to oo7.
  - type: script
    snippets:
      - mkdir -p /usr/lib/systemd/user/niri.service.wants
      - ln -s ../dms.service /usr/lib/systemd/user/niri.service.wants/dms.service
      - ln -s ../dcal.service /usr/lib/systemd/user/niri.service.wants/dcal.service
      - |
        if [ -f /usr/lib/systemd/user/oo7-daemon.service ]; then
          ln -s ../oo7-daemon.service /usr/lib/systemd/user/niri.service.wants/oo7-daemon.service
          printf '%s\n' '[D-BUS Service]' 'Name=org.freedesktop.secrets' 'Exec=/bin/false' 'SystemdService=oo7-daemon.service' > /usr/share/dbus-1/services/org.freedesktop.secrets.service
        fi
