# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Preferences valid on any Bazzite machine.
modules:
  - type: files
    files:
      - source: shared
        destination: /

  - type: dnf
    install:
      packages:
        - lsp-plugins-ladspa   # Boost EQ limiter; replaces portable/lsp-ladspa and the LADSPA_PATH drop-in
    remove:
      packages:
        - input-remapper
        - waydroid
        - lutris
        - webapp-manager
        - uld
        - tailscale
        - scx-scheds           # sched_ext must stay off (browser audio crackle)
        - scx-tools

  # The upstream-linked COPR ships new Ghostty releases first; Terra lags. The package includes shell integration.
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
      cleanup: true
    install:
      packages:
        - ghostty

  - type: script
    scripts:
      - brave-origin.sh
      - branding.sh

  - type: copy
    from: holdsuper
    src: /out/holdsuper
    dest: /usr/bin/
  - type: copy
    from: vkpace
    src: /out/libvkpace.so
    dest: /usr/lib64/vkpace/

  - type: systemd
    system:
      masked:
        - rpm-ostree-countme.timer
        - passim.service          # fwupd's LAN cache server (mDNS, port 27500)
    user:
      enabled:
        - holdsuper.service       # waits for a front end; holds no device without one
        - holdsuper-kde.service   # the front end in Plasma
