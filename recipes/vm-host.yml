# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Facts about vm-silverblue: OmacVM.app on a MacBook, GPU through virgl (OpenGL) and Venus (Vulkan), the Mac's camera
# through v4l2loopback. Secrets stay out: /etc/omacvm (the Touch ID key) is written on the VM by silverblue-omacvm.
modules:
  - type: files
    files:
      - source: vm
        destination: /

  - type: script
    scripts:
      - vm-mesa.sh

  - type: dnf
    install:
      packages:
        - python3-evdev        # OmacVM's gestures and side-button daemons (silverblue-omacvm)
        - gcc                  # the C linker for cargo (sys in ~/home); came with akmods before the prebuilt module

  # Fedora has no Ghostty. Terra is on only for this module: its dependencies (gtk4-layer-shell) come from Fedora.
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      cleanup: true
    install:
      packages:
        - ghostty

  # Ghostty draws only with OpenGL 4.3. virgl gives 4.1 without storage buffers, Zink only 2.1, so llvmpipe.
  # Every launcher (desktop file, D-Bus, systemd unit) runs /usr/bin/ghostty: the wrapper covers them all.
  - type: script
    snippets:
      - mv /usr/bin/ghostty /usr/libexec/ghostty && printf '#!/bin/sh\nLIBGL_ALWAYS_SOFTWARE=1 exec /usr/libexec/ghostty "$@"\n' > /usr/bin/ghostty && chmod 755 /usr/bin/ghostty

  - type: copy
    from: v4l2loopback
    src: /out/
    dest: /tmp/v4l2loopback/
  - type: script
    snippets:
      - dnf -y install /tmp/v4l2loopback/*.rpm && rm -rf /tmp/v4l2loopback
      # The package's options ("OBS Virtual Camera", one device) would replace those of 90-omacvm-camera.conf.
      - rm /usr/lib/modprobe.d/98-v4l2loopback.conf
