# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Facts about vm-silverblue: OmacVM.app on a MacBook, GPU through virgl (OpenGL) and Venus (Vulkan), the Mac's camera
# through v4l2loopback. Secrets stay out: the Touch ID key (/etc/omacvm/touchid-key) is put on the VM by hand.
modules:
  - type: files
    files:
      - source: vm
        destination: /

  - type: script
    scripts:
      - vm-mesa.sh

  - type: dnf
    install:
      packages:
        - python3-evdev        # OmacVM's gestures and side-button daemons (files/vm)
        - gcc                  # the C linker for cargo (sys in ~/home); came with akmods before the prebuilt module

  # Fedora has no Ghostty. The upstream-linked COPR ships new releases first; Terra lags.
  # Ghostty needs OpenGL 4.3 (virgl gives 4.1): libEGL_omacvm (stage omacvm-gpu) gives it Zink with OmacVM's switch,
  # else llvmpipe. Do not set LIBGL_ALWAYS_SOFTWARE or a driver variable for it: the library then keeps out.
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
      cleanup: true
    install:
      packages:
        - ghostty

  - type: copy
    from: v4l2loopback
    src: /out/
    dest: /tmp/v4l2loopback/
  - type: script
    snippets:
      - dnf -y install /tmp/v4l2loopback/*.rpm && rm -rf /tmp/v4l2loopback
      # The package's options ("OBS Virtual Camera", one device) would replace those of 90-omacvm-camera.conf.
      - rm /usr/lib/modprobe.d/98-v4l2loopback.conf

  # OmacVM's virtio-gpu driver (cursor plane for niri, the damage fix), its VA-API and EGL shims: built for this
  # image's kernel and Mesa in the stage omacvm-gpu (files/src/omacvm-gpu).
  - type: copy
    from: omacvm-gpu
    src: /out/
    dest: /tmp/omacvm-gpu/
  - type: script
    scripts:
      - install-omacvm-gpu.sh

  # The Mac's battery as a real one (BAT0, ADP0) and its display brightness as the backlight "omacvm": the
  # desktops' own indicators and sliders show them. The modules come from the stage omacvm-modules
  # (files/src/omacvm-battery, files/src/omacvm-backlight), the agents and their units from files/vm.
  - type: copy
    from: omacvm-modules
    src: /out/
    dest: /tmp/omacvm-modules/
  - type: script
    scripts:
      - install-omacvm-modules.sh

  # OmacVM's guest agents for this VM (upstream's, files/vm; docs/vm-silverblue.md), and Touch ID for sudo and polkit.
  - type: script
    scripts:
      - install-omacvm-touchid.sh

  - type: systemd
    system:
      enabled:
        - omacvm-battery.service
        - omacvm-app-host.service       # the Mac's settings at start -> /run/omacvm/host.env (Ghostty's GPU, FullPanel)
        - omacvm-gestures.service
        - omacvm-mac-folder.service
        - omacvm-guest-agent-unconfined.service
        - sshd.service                  # SSH from the Mac
    user:
      enabled:
        - omacvm-clipboard.service
        - omacvm-side-buttons.service
        - omacvm-camera.service
        - omacvm-usbcam.service
        - omacvm-audio-latency.service
        - omacvm-bridge-events.socket   # OmacVM Bridge on the Mac: the Mac's volume and brightness popups
        - omacvm-mac-levels.service     # the "Mac" output and the "omacvm" backlight follow the Mac
