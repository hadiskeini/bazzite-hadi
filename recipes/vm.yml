# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# vm-silverblue: Fedora Silverblue on aarch64 in OmacVM.app, with the Mac camera module and the VM's system config
# built in. Built natively on an arm64 runner; shared.yml and pc.yml are Bazzite-only, hyprland.yml is in both images.
name: silverblue-vm
description: Fedora Silverblue for vm-silverblue (aarch64) with the Mac camera module and the VM's system config built in
base-image: quay.io/fedora/fedora-silverblue
image-version: 45
# Replaces the default tags: a build never moves :latest. The workflow moves it after the import test.
alt-tags:
  - staging

stages:
  - name: tabbar
    from: registry.fedoraproject.org/fedora:45
    modules:
      - type: files
        files:
          - source: src/tabbar
            destination: /src
      - type: script
        snippets:
          - dnf -y install dnf-plugins-core gcc-c++ pkgconf-pkg-config && dnf -y copr enable lionheartp/Hyprland && dnf -y install --setopt=install_weak_deps=False hyprland-git-devel
          # A plugin that does not build must not stop the image: tabs.lua then uses Hyprland's own bar.
          - >-
            mkdir -p /out && rpm -q --qf '%{VERSION}-%{RELEASE}' hyprland-git > /out/hyprland-version &&
            { g++ -shared -fPIC -O2 -std=c++2b -Wall -Wno-c++11-narrowing --no-gnu-unique
            $(pkg-config --cflags hyprland pixman-1 libdrm libinput libudev wayland-server xkbcommon hyprgraphics)
            /src/main.cpp /src/icons.cpp -o /out/tabbar.so $(pkg-config --libs hyprgraphics)
            || echo "WARNING: tabbar plugin did not build; the image ships without it"; }

  - name: v4l2loopback
    from: quay.io/fedora/fedora-silverblue:45
    modules:
      - type: script
        scripts:
          - build-v4l2loopback.sh
  - name: omacvm-gpu
    from: quay.io/fedora/fedora-silverblue:45
    modules:
      - type: files
        files:
          - source: src/omacvm-gpu
            destination: /src
      - type: script
        scripts:
          - build-omacvm-gpu.sh
  - name: omacvm-modules
    from: quay.io/fedora/fedora-silverblue:45
    modules:
      - type: files
        files:
          - source: src/omacvm-battery
            destination: /src/omacvm-battery
          - source: src/omacvm-backlight
            destination: /src/omacvm-backlight
      - type: script
        scripts:
          - build-omacvm-modules.sh

modules:
  - from-file: vm-host.yml
  - from-file: hyprland.yml
  - type: gschema-overrides
    include:
      - zz1-common.gschema.override
  # dnf scriptlets leave files in /run; it is a tmpfs at runtime, and bootc container lint flags them.
  - type: script
    snippets:
      - rm -rf /run/dnf /run/selinux-policy
  # Last: puts the udev rules and the v4l2loopback module into the initramfs.
  - type: initramfs
  - type: signing
