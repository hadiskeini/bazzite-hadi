# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# vm-silverblue: Fedora Silverblue on aarch64 in OmacVM.app, with the Mac camera module and the VM's system config
# built in. Built natively on an arm64 runner; shared.yml and pc.yml are Bazzite-only.
name: silverblue-vm
description: Fedora Silverblue for vm-silverblue (aarch64) with the Mac camera module and the VM's system config built in
base-image: quay.io/fedora/fedora-silverblue
image-version: 45
# Replaces the default tags: a build never moves :latest. The workflow moves it after the import test.
alt-tags:
  - staging

stages:
  - name: v4l2loopback
    from: quay.io/fedora/fedora-silverblue:45
    modules:
      - type: script
        scripts:
          - build-v4l2loopback.sh

modules:
  - from-file: vm-host.yml
  # dnf scriptlets leave files in /run; it is a tmpfs at runtime, and bootc container lint flags them.
  - type: script
    snippets:
      - rm -rf /run/dnf /run/selinux-policy
  # Last: puts the udev rules and the v4l2loopback module into the initramfs.
  - type: initramfs
  - type: signing
