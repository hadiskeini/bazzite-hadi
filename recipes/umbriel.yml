# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Umbriel (stacking) with the Noctalia shell, next to GNOME; in both images. Sources as the official install guides
# name them: Umbriel and its portal are Terra nightlies, Noctalia is Fedora's own package.
# Umbriel starts its own Xwayland (general.xwayland); Noctalia starts from Umbriel's autostart in the user config.
modules:
  # Bazzite defines a disabled terra repo (a second file with the same id is ignored); Silverblue has none.
  # Xwayland is already in both bases (Bazzite's is Terra's own build, which conflicts with Fedora's).
  - type: script
    snippets:
      - |
        if ! dnf repolist --all | grep -q '^terra '; then
          curl -fsSL https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo -o /etc/yum.repos.d/umbriel-terra.repo
        fi
        dnf -y --enablerepo=terra install umbriel-nightly xdg-desktop-portal-umbriel-nightly noctalia
        rm -f /etc/yum.repos.d/umbriel-terra.repo

  # umbriel-portals.conf replaces the package's own: it adds oo7 as the Secret portal. Also the Umbriel oo7 hook
  # and holdsuper's front end. The GDM session entry is the package's.
  - type: files
    files:
      - source: umbriel
        destination: /

  # Keep Noctalia's launchers out of GNOME's app grid. The session sets XDG_CURRENT_DESKTOP=umbriel (lowercase).
  - type: script
    snippets:
      - for f in /usr/share/applications/dev.noctalia.Noctalia*.desktop; do sed -i '/^\[Desktop Entry\]/a OnlyShowIn=Umbriel;umbriel;' "$f"; done

  - type: systemd
    user:
      enabled:
        - holdsuper-umbriel.service
