# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# COSMIC as one more session next to GNOME, in both images; Fedora's own packages, GDM stays the login screen.
# To remove: delete this file, files/cosmic, its from-file lines and its paths in .github/fingerprint/silverblue-vm.sh.
modules:
  - type: dnf
    install:
      packages:
        - cosmic-session
        - cosmic-files
        - cosmic-edit
        - cosmic-term
        - cosmic-player

  # cosmic-greeter is here for the lock screen only; its login-screen users and /var directories must not reach the hosts.
  - type: script
    snippets:
      - |
        userdel cosmic-greeter
        userdel greetd
        rm -r /var/lib/greetd
        rm /usr/lib/sysusers.d/{greetd,cosmic-greeter}.conf /usr/lib/tmpfiles.d/{greetd,cosmic-greeter}.conf

  # apply_theme_global replaces cosmic-config-fedora's "true", which writes ~/.config/gtk-{3,4}.0/gtk.css for all sessions.
  - type: files
    files:
      - source: cosmic
        destination: /

  - type: script
    snippets:
      - for f in /usr/share/applications/com.system76.Cosmic*.desktop; do grep -q '^OnlyShowIn=' "$f" || sed -i '/^\[Desktop Entry\]/a OnlyShowIn=COSMIC;' "$f"; done
