# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Hyprland next to GNOME and niri, with Dux Shell; in both images. The COPR is the one the Hyprland wiki names for
# Fedora. uwsm runs the session as systemd units: pick "Hyprland (uwsm-managed)" in GDM, not "Hyprland". The COPR
# ships only the plain entry; files/shared/usr/share/wayland-sessions/hyprland-uwsm.desktop is the uwsm one.
# No hyprpolkitagent: Dux Shell has its own polkit agent.
modules:
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
      cleanup: true
    install:
      packages:
        - hyprland
        - xdg-desktop-portal-hyprland
        - hyprland-guiutils
        - uwsm
