# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# pc-bazzite: Bazzite GNOME (testing) with Fedora branding, trimmed, and this PC's system config built in.
# shared.yml = preferences valid on any Bazzite machine; pc.yml = facts about this PC.
name: bazzite-hadi
description: Bazzite GNOME with Fedora branding, trimmed, with the pc-bazzite system config built in
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: testing
# Replaces the default tags: a build never moves :latest. The workflow moves it after the import test.
alt-tags:
  - staging

stages:
  - name: holdsuper
    from: registry.fedoraproject.org/fedora:45
    modules:
      - type: files
        files:
          - source: src/holdsuper
            destination: /src
      - type: script
        snippets:
          - dnf -y install gcc && mkdir -p /out && gcc -O2 -Wall -Wextra -o /out/holdsuper /src/holdsuper.c

  - name: vkpace
    from: registry.fedoraproject.org/fedora:45
    modules:
      - type: files
        files:
          - source: src/vkpace
            destination: /src
      - type: script
        snippets:
          - dnf -y install gcc vulkan-headers && mkdir -p /out && gcc -shared -fPIC -O2 -Wall -Wno-misleading-indentation -o /out/libvkpace.so /src/vkpace.c -lm -lpthread

  - name: tabbar
    from: registry.fedoraproject.org/fedora:45
    modules:
      - type: files
        files:
          - source: src/tabbar
            destination: /src
      - type: script
        snippets:
          - dnf -y install dnf-plugins-core gcc-c++ pkgconf-pkg-config && dnf -y copr enable lionheartp/Hyprland && dnf -y install --setopt=install_weak_deps=False hyprland-git-devel
          # A plugin that does not build must not stop the image: tabs.lua then uses Hyprland's own bar.
          - >-
            mkdir -p /out && rpm -q --qf '%{VERSION}-%{RELEASE}' hyprland-git > /out/hyprland-version &&
            { g++ -shared -fPIC -O2 -std=c++2b -Wall -Wno-c++11-narrowing --no-gnu-unique
            $(pkg-config --cflags hyprland pixman-1 libdrm libinput libudev wayland-server xkbcommon hyprgraphics)
            /src/main.cpp /src/icons.cpp -o /out/tabbar.so $(pkg-config --libs hyprgraphics)
            || echo "WARNING: tabbar plugin did not build; the image ships without it"; }

  - name: scyrox-tools
    from: registry.fedoraproject.org/fedora:45
    modules:
      - type: script
        snippets:
          # Pinned commit: the repo has no tags. Bump it here to update.
          - dnf -y install python3 git && python3 -m venv /usr/lib/scyrox-tools && /usr/lib/scyrox-tools/bin/pip install --no-cache-dir "git+https://github.com/hadiskeini/scyrox-tools@ae8d7e32513f0a09ba8347cd8fbe95493e57de91"

modules:
  - from-file: shared.yml
  - from-file: pc.yml
  - from-file: hyprland.yml
  # dnf scriptlets leave files in /run; it is a tmpfs at runtime, and bootc container lint flags them.
  - type: script
    snippets:
      - rm -rf /run/dnf /run/selinux-policy
  # Last: puts the restored boot splash and the modprobe.d/modules-load.d changes into the initramfs.
  - type: initramfs
  - type: signing
