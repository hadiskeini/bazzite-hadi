# Bazzite ships /usr/share/wireplumber/wireplumber.conf.d/51-disable-suspension.conf, which sets
# session.suspend-timeout-seconds = 0 for *every* alsa_input.*/alsa_output.* node. For the Insta360
# Link 2C that means PipeWire never closes the UVC device's audio capture interface: the USB audio
# altsetting stays at 1 forever and the camera firmware keeps the green privacy LED lit long after
# the mic was deselected. Re-enable suspension for the camera only; the EVO4 keeps the never-suspend
# behaviour the Bazzite default is there for.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Insta360.*" }
      { node.name = "~alsa_output.usb-Insta360.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
