# The Insta360 Link 2C's audio suspends after 5 s idle, so the camera closes its USB audio interface and turns off the
# green privacy LED. Bazzite's 51-disable-suspension.conf (absent from this base today) sets 0 for every ALSA node;
# this rule keeps the camera at 5 s if it comes back. The EVO4 has no rule: it uses WirePlumber's default of 5 s.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Insta360.*" }
      { node.name = "~alsa_output.usb-Insta360.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
