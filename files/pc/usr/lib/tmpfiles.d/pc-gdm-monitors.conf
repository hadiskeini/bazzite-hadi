# GDM greeter monitor layout (144 Hz on the 4K panel). C copies only when the file is missing, so it seeds a
# fresh install; a later change to the source never reaches an existing install.
d /var/lib/gdm/seat0/config 0700 gdm gdm -
C /var/lib/gdm/seat0/config/monitors.xml - - - - /usr/share/pc-bazzite/gdm-monitors.xml
z /var/lib/gdm/seat0/config/monitors.xml 0644 gdm gdm -
