# Local sysctl (PLAYBOOK §2, etc/ drop-in). Bazzite already ships bbr, tcp_mtu_probing, vm.max_map_count,
# split_lock_mitigate=0 under /usr/lib/sysctl.d — not repeated here.

# Cap dirty page cache by bytes, not by percentage of RAM. On 32 GiB the ratio defaults allow ~6.5 GiB
# dirty before throttling: a game install or shader-cache regeneration then stalls everything touching the
# filesystem at btrfs' 30 s commit. 256/64 MiB keeps writeback continuous and bounded. Setting *_bytes
# zeroes the corresponding *_ratio — expected.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# fq is what makes bbr pace correctly; Fedora defaults to fq_codel. Harmless if Bazzite already sets it.
net.core.default_qdisc = fq

# The only swap is zram (Bazzite default, zstd). page-cluster is swap-in readahead, a disk-seek optimisation; on
# zram each extra page is only an extra decompression, so 0, as the kernel docs say and as vm-silverblue sets.
# swappiness stays 60 (the VM uses 180): 32 GiB and no memory pressure here, and a game working set that lands in
# zram costs decompression stalls mid-frame, so swapping more eagerly has no upside on this box.
vm.page-cluster = 0
