# The VM's default output, "Mac". Its volume and mute go to the Mac (omacvm-mac-levels) and are not applied here:
# capture.volumes hands them to the Mult controls, and min = max = 1 keeps those at unity.
# A target.object on the playback side left it linked but silent; passive, as the EQ filters, it plays.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Mac"
            media.name       = "Mac"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            filter.graph = {
                nodes = [
                    { type = builtin name = left  label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin name = right label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
                ]
                inputs  = [ "left:In" "right:In" ]
                outputs = [ "left:Out" "right:Out" ]
                capture.volumes = [
                    { control = "left:Mult"  min = 1.0 max = 1.0 }
                    { control = "right:Mult" min = 1.0 max = 1.0 }
                ]
            }
            capture.props = {
                node.name        = "omacvm_mac_output"
                media.class      = Audio/Sink
                priority.session = 2000
            }
            playback.props = {
                node.name    = "omacvm_mac_output.out"
                node.passive = true
            }
        }
    }
]
