# OmacVM: from try-omarchy (90-try-omarchy-camera.conf), MIT, (c) Try Omarchy contributors.
# The Mac's camera and a Mac USB webcam. exclusive_caps: apps see a normal camera once
# omacvm-camera has written its first frame. The initramfs loads the module, so /etc is not read.
options v4l2loopback devices=2 video_nr=42,43 card_label="Mac Camera,USB Camera" exclusive_caps=1,1 max_openers=10
