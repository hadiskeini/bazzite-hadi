# The only swap is zram (zram-generator.conf.d/90-vm.conf), so the kernel defaults tuned for disk swap are wrong.
# Swap-in from zram is a decompression, not a seek: readahead of 8 pages only adds work, and swapping idle anonymous
# memory is cheaper than evicting page cache that must be read back from disk. 180 is the value the kernel docs give for zram.
vm.page-cluster = 0
vm.swappiness = 180
