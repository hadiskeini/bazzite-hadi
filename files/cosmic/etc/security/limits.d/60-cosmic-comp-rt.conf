# cosmic-comp runs in the login session, whose limits come from PAM (user services get theirs from user@.service).
# Without this, cosmic-comp-rt.service cannot give it a realtime priority.
# PAM also runs for user@.service: this value must not be below LimitRTPRIO in 90-pc-audio-rt.conf, or it caps
# the whole user manager and PipeWire's data loop loses realtime.
@wheel - rtprio 98
