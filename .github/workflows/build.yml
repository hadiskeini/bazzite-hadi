name: bluebuild
on:
  schedule:
    # Ready well before the PC starts around 18:00. Odd minutes: GitHub delays and drops most near :00.
    # GitHub can drop a scheduled run, so a second slot backs up the first; it skips if the first built
    # (job "check"). Cron is UTC: GitHub ignores a "timezone" key.
    - cron: "37 11 * * *"
    - cron: "37 13 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:          # a manual run always builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bazzite-hadi:
    uses: ./.github/workflows/image.yml
    with:
      image: bazzite-hadi
      recipe: recipe.yml
      base: ghcr.io/ublue-os/bazzite-gnome:testing
      runner: ubuntu-24.04
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  # vm-silverblue: aarch64, built natively on GitHub's arm64 runner (no emulation).
  silverblue-vm:
    uses: ./.github/workflows/image.yml
    with:
      image: silverblue-vm
      recipe: vm.yml
      base: quay.io/fedora/fedora-silverblue:45
      runner: ubuntu-24.04-arm
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
